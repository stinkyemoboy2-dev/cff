<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>loveisalifesentence - Coming Soon</title>
    <style>
        body {
            background-color: #ffffff !important;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            margin: 0;
            padding: 0;
        }

        /* HEADER CONTAINER MATCHING MAIN PAGE */
        .brand-header-table {
            width: 800px;
            margin: 0 auto;
            background-color: #ffffff;
            border-bottom: 1px solid #cc0000;
            border-collapse: collapse;
        }

        .myspace-logo-cell {
            padding: 40px 10px; /* Added extra padding to center it on the screen */
            text-align: center;
            vertical-align: middle;
            white-space: nowrap;
        }

        /* TEXT CHANGED TO USERNAME AS REQUESTED */
        .logo-text-main {
            font-family: "Arial Black", Gadget, sans-serif;
            font-size: 32px;
            color: #cc0000;
            letter-spacing: -2px;
            display: inline-block;
            vertical-align: middle;
        }

        /* TEXT CHANGED TO "SOON" WITH NO .COM BOX STYLE */
        .soon-text-label {
            font-family: "Arial Black", Gadget, sans-serif;
            font-size: 24px;
            color: #666666;
            margin-left: 10px;
            display: inline-block;
            vertical-align: middle;
        }

        /* ORIGINAL HEART AND PROFILE ICON CONTAINER */
        .heart-wrapper {
            display: inline-block;
            position: relative;
            width: 28px;
            height: 28px;
            background-color: #cc0000;
            transform: rotate(-45deg);
            margin-left: 15px;
            vertical-align: middle;
        }
        .heart-wrapper::before, .heart-wrapper::after {
            content: "";
            position: absolute;
            width: 28px;
            height: 28px;
            background-color: #cc0000;
            border-radius: 50%;
        }
        .heart-wrapper::before { top: -14px; left: 0; }
        .heart-wrapper::after { top: 0; left: 14px; }

        .heart-avatar-mask {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #ffffff;
            border-radius: 50%;
            top: 5px;
            left: 6px;
            transform: rotate(45deg);
            z-index: 5;
        }
        .heart-avatar-mask::after {
            content: "";
            position: absolute;
            width: 16px;
            height: 12px;
            background-color: #ffffff;
            border-radius: 7px 7px 0 0;
            top: 9px;
            left: -2px;
        }
    </style>
</head>
<body>

    <!-- BRAND LOGO SCREEN -->
    <table class="brand-header-table" cellpadding="0" cellspacing="0" border="0">
        <tr>
            <td class="myspace-logo-cell">
                <span class="logo-text-main">loveisalifesentence</span>
                <div class="heart-wrapper"><div class="heart-avatar-mask"></div></div>
                <span class="soon-text-label">soon</span>
            </td>
        </tr>
    </table>

</body>
</html>
